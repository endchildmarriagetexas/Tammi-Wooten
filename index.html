<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tammi Wooten | Child Marriage Survivor & Advocate</title>

<style>

:root{
    --pink:#FF5CB8;
    --purple:#8B5CF6;
    --blue:#4A7DFF;

    --light:#FCFBFF;
    --white:#FFFFFF;
    --dark:#25253D;
    --gray:#666;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Segoe UI",sans-serif;
    background:var(--light);
    color:var(--dark);
    line-height:1.8;
}

/* Navigation */

nav{
    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(10px);

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:20px 8%;
}

.logo{
    font-size:1.4rem;
    font-weight:bold;
    color:var(--purple);
}

nav ul{
    display:flex;
    list-style:none;
    gap:25px;
}

nav a{
    text-decoration:none;
    color:var(--dark);
    font-weight:600;
}

nav a:hover{
    color:var(--pink);
}

/* Hero */

header{
    background:linear-gradient(
        135deg,
        var(--pink),
        var(--purple),
        var(--blue)
    );

    color:white;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    padding:120px 20px 80px;
}

.hero{
    max-width:900px;
}

.hero h1{
    font-size:4rem;
    margin-bottom:15px;
}

.hero h2{
    font-size:1.8rem;
    font-weight:300;
    margin-bottom:25px;
}

.hero p{
    font-size:1.2rem;
    max-width:700px;
    margin:auto;
}

.button{
    display:inline-block;
    margin-top:30px;
    padding:15px 35px;

    background:white;
    color:var(--purple);

    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
}

.button:hover{
    transform:translateY(-2px);
}

/* Sections */

section{
    padding:90px 10%;
}

.section-title{
    text-align:center;
    font-size:2.5rem;
    color:var(--purple);
    margin-bottom:40px;
}

.story{
    max-width:900px;
    margin:auto;
    text-align:center;
}

.story p{
    margin-bottom:20px;
}

/* Welcome Card */

.welcome{
    max-width:1100px;
    background:white;
    margin:-60px auto 0;
    padding:40px;
    border-radius:25px;

    box-shadow:0 10px 30px rgba(0,0,0,.08);

    text-align:center;
}

/* Quote */

.quote{
    background:linear-gradient(
        135deg,
        var(--pink),
        var(--purple),
        var(--blue)
    );

    color:white;
    text-align:center;
    padding:100px 20px;
}

.quote blockquote{
    max-width:900px;
    margin:auto;
    font-size:2rem;
}

/* Cards */

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    padding:30px;
    border-radius:25px;

    box-shadow:0 8px 25px rgba(0,0,0,.08);

    border-top:5px solid var(--pink);

    transition:.3s;
}

.card:nth-child(2){
    border-color:var(--purple);
}

.card:nth-child(3){
    border-color:var(--blue);
}

.card:nth-child(4){
    border-color:var(--pink);
}

.card:hover{
    transform:translateY(-6px);
}

.card h3{
    color:var(--purple);
    margin-bottom:15px;
}

/* Contact */

.contact{
    background:white;
}

.contact-card{
    max-width:800px;
    margin:auto;
    text-align:center;

    background:white;
    padding:50px;

    border-radius:25px;

    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.contact-btn{
    display:inline-block;

    margin-top:25px;

    padding:15px 35px;

    background:linear-gradient(
        135deg,
        var(--pink),
        var(--purple),
        var(--blue)
    );

    color:white;
    text-decoration:none;

    border-radius:50px;
    font-weight:bold;
}

.email{
    margin-top:20px;
    color:var(--gray);
}
